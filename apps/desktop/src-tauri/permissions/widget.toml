[[permission]]
identifier = "allow-widget-commands"
description = "Allow Brainlogs widget and recall-strip IPC (hide, quit, pin, mode, capture, front window)"
commands.allow = [
  "hide_widget",
  "quit_app",
  "set_widget_mode",
  "set_always_on_top",
  "core_base_url",
  "api_token",
  "capture_status",
  "pause_capture",
  "resume_capture",
  "open_accessibility_settings",
  "prompt_accessibility",
  # The recall strip. Without these three the strip's every poll is denied by the capability and
  # it can never appear, which is exactly what happened in 1.2.0 and 1.3.0.
  "current_window",
  "recall_show",
  "recall_hide"
]
